<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoCall — Chat Test</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#172033}.app{max-width:920px;margin:24px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 35px #0001}.head{padding:20px;background:#2563eb;color:#fff}.head h1{margin:0 0 5px}.panel{padding:18px;border-bottom:1px solid #e5e9ef}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.find input,.composer input{width:100%;padding:13px;border:1px solid #cfd7e3;border-radius:10px;font-size:15px}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 17px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#e8eefc;color:#2452ad}.status{padding:12px 18px;font-size:14px}.error{color:#b42318}.ok{color:#067647}.find{display:flex;gap:10px}.find input{flex:1}.user{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf0f4}.chatbar{padding:16px;border-bottom:1px solid #e5e9ef;font-weight:700}.messages{height:390px;overflow:auto;padding:18px;background:#f7f9fc}.msg{max-width:72%;padding:10px 13px;border-radius:14px;background:#fff;border:1px solid #e0e6ee;margin:7px 0}.mine{margin-left:auto;background:#dbeafe;border-color:#bfdbfe}.meta{font-size:11px;color:#6b7280;margin-top:4px}.composer{display:flex;gap:10px;padding:16px}.composer input{flex:1}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.app{margin:0;border-radius:0;min-height:100vh}}
</style></head><body><div class="app"><div class="head"><h1>💬 VideoCall Chat</h1><div>Phone-number messaging test</div></div>
<div class="panel"><h3>1. Register this device</h3><div class="grid"><div class="field"><label>Phone number</label><input id="phone" type="tel" placeholder="+2348012345678"></div><div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@example.com"></div></div><div class="actions"><button class="btn" id="sendCode">Send email code</button></div><div class="grid" style="margin-top:12px"><div class="field"><label>Verification code</label><input id="code" inputmode="numeric" placeholder="Code from email"></div><div class="actions" style="align-items:end"><button class="btn alt" id="verify">Verify & continue</button></div></div></div>
<div class="status" id="status">Enter your phone number and email to begin.</div><div class="panel hidden" id="searchPanel"><h3>2. Search by phone number</h3><div class="find"><input id="findPhone" type="tel" placeholder="Other person's phone number"><button class="btn" id="searchBtn">Search</button></div><div id="users" style="margin-top:10px"></div></div><div class="chatbar hidden" id="chatBar">💬 Chat with <span id="chatName"></span></div><div class="messages" id="messages"><div class="status">Register first, then search for another phone number.</div></div><div class="composer"><input id="message" placeholder="Type a message..." disabled><button class="btn" id="send" disabled>Send</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://ifzwpwxuczxicqgwakrc.supabase.co';const SUPABASE_KEY='REPLACE_WITH_YOUR_SUPABASE_PUBLISHABLE_KEY';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});let me=null,other=null,conversationId=null,channel=null;const $=id=>document.getElementById(id);function setStatus(t,c=''){const e=$('status');e.textContent=t;e.className='status '+c}
$('sendCode').onclick=async()=>{const email=$('email').value.trim(),phone=$('phone').value.trim();if(!email||!phone)return setStatus('Phone number and email are required.','error');localStorage.setItem('pending_phone',phone);const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)return setStatus(error.message,'error');setStatus('Code sent to '+email+'. Check your email.','ok')};
$('verify').onclick=async()=>{const email=$('email').value.trim(),token=$('code').value.trim(),phone=$('phone').value.trim();if(!email||!token||!phone)return setStatus('Enter phone, email and verification code.','error');const {data,error}=await sb.auth.verifyOtp({email,token,type:'email'});if(error)return setStatus(error.message,'error');me=data.user;const {error:pe}=await sb.from('profiles').upsert({id:me.id,email:me.email,phone_number:phone},{onConflict:'id'});if(pe)return setStatus(pe.message,'error');$('searchPanel').classList.remove('hidden');setStatus('Registered. You can now search another device by its phone number.','ok')};
$('searchBtn').onclick=async()=>{if(!me)return setStatus('Register first.','error');const phone=$('findPhone').value.trim();if(!phone)return setStatus('Enter a phone number.','error');const {data,error}=await sb.from('profiles').select('id,display_name,email,phone_number').eq('phone_number',phone).neq('id',me.id).maybeSingle();if(error)return setStatus(error.message,'error');$('users').innerHTML='';if(!data){$('users').innerHTML='<div class="status">No VideoCall account found for this phone number.</div>';return}const row=document.createElement('div');row.className='user';row.innerHTML='<span>👤 '+(data.display_name||data.phone_number)+'</span><button class="btn">Start chat</button>';row.querySelector('button').onclick=()=>openChat(data);$('users').appendChild(row)};
async function openChat(u){other=u;let found=null;const {data:mine}=await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);const ids=(mine||[]).map(x=>x.conversation_id);if(ids.length){const {data:their}=await sb.from('conversation_members').select('conversation_id').in('conversation_id',ids).eq('user_id',u.id);found=their?.[0]?.conversation_id||null}if(!found){const {data:c,error}=await sb.from('conversations').insert({conversation_type:'direct',created_by:me.id}).select('id').single();if(error)return setStatus(error.message,'error');found=c.id;const {error:e}=await sb.from('conversation_members').insert([{conversation_id:c.id,user_id:me.id},{conversation_id:c.id,user_id:u.id}]);if(e)return setStatus(e.message,'error')}conversationId=found;$('chatBar').classList.remove('hidden');$('chatName').textContent=u.display_name||u.phone_number;$('message').disabled=false;$('send').disabled=false;await loadMessages();if(channel)await sb.removeChannel(channel);channel=sb.channel('messages-'+conversationId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+conversationId},p=>renderMessage(p.new)).subscribe();setStatus('Chat connected with '+(u.phone_number||u.email),'ok')}
async function loadMessages(){const {data,error}=await sb.from('messages').select('*').eq('conversation_id',conversationId).order('created_at',{ascending:true});if(error)return setStatus(error.message,'error');$('messages').innerHTML='';(data||[]).forEach(renderMessage);$('messages').scrollTop=$('messages').scrollHeight}function renderMessage(m){if(document.querySelector('[data-id="'+m.id+'"]'))return;const d=document.createElement('div');d.dataset.id=m.id;d.className='msg '+(m.sender_id===me.id?'mine':'');d.innerHTML='<div>'+escapeHtml(m.body||'')+'</div><div class="meta">'+new Date(m.created_at).toLocaleTimeString()+'</div>';$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
$('send').onclick=sendMessage;$('message').onkeydown=e=>{if(e.key==='Enter')sendMessage()};async function sendMessage(){const body=$('message').value.trim();if(!body||!conversationId)return;const {data,error}=await sb.from('messages').insert({conversation_id:conversationId,sender_id:me.id,message_type:'text',body}).select().single();if(error)return setStatus(error.message,'error');$('message').value='';renderMessage(data)}function escapeHtml(s){return s.replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function init(){const {data}=await sb.auth.getSession();if(data.session){me=data.session.user;$('searchPanel').classList.remove('hidden');setStatus('Already signed in as '+(me.email||'')+'.','ok')}}init();
</script></body></html>
