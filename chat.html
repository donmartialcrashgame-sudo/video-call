<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoCall — Chat Test</title><style>body{margin:0;font-family:Arial;background:#eef2f7;color:#172033}.app{max-width:900px;margin:24px auto;background:white;border-radius:18px;overflow:hidden}.head{padding:20px;background:#2563eb;color:white}.panel{padding:18px;border-bottom:1px solid #ddd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}.field input,.find input,.composer input{width:100%;padding:13px;border:1px solid #ccd3dd;border-radius:10px;box-sizing:border-box}.actions,.find,.composer{display:flex;gap:10px;margin-top:12px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}.alt{background:#e8eefc;color:#2452ad}.status{padding:12px 18px}.error{color:#b42318}.ok{color:#067647}.hidden{display:none}.user{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.chatbar{padding:16px;font-weight:bold;border-bottom:1px solid #ddd}.messages{height:390px;overflow:auto;padding:18px;background:#f7f9fc}.msg{max-width:72%;padding:10px 13px;border-radius:14px;background:white;border:1px solid #e0e6ee;margin:7px 0}.mine{margin-left:auto;background:#dbeafe}.meta{font-size:11px;color:#6b7280;margin-top:4px}@media(max-width:650px){.grid{grid-template-columns:1fr}.app{margin:0;border-radius:0;min-height:100vh}}</style></head><body><div class="app"><div class="head"><h1>💬 VideoCall Chat</h1><div>Temporary phone-number messaging test</div></div><div class="panel"><h3>1. Register this device</h3><div class="grid"><div class="field"><label>Phone number</label><input id="phone" type="tel" placeholder="+2348012345678"></div><div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@example.com"></div></div><div class="actions"><button class="btn" id="register">Register / Continue</button></div></div><div id="status" class="status">For testing only — no OTP or SMTP is used.</div><div id="searchPanel" class="panel hidden"><h3>2. Search another user by phone</h3><div class="find"><input id="findPhone" type="tel" placeholder="Other person's phone number"><button class="btn" id="searchBtn">Search</button></div><div id="users"></div></div><div id="chatBar" class="chatbar hidden">💬 Chat with <span id="chatName"></span></div><div id="messages" class="messages"><div class="status">Register first, then search for another phone number.</div></div><div class="composer"><input id="message" placeholder="Type a message..." disabled><button class="btn" id="send" disabled>Send</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://ifzwpwxuczxicqgwakrc.supabase.co';const SUPABASE_KEY='sb_publishable_IPecJbLMrs0q6s56vZamJQ_K5B9ZmXt';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});let me=null,conversationId=null,channel=null;const $=id=>document.getElementById(id);function status(t,c=''){const e=$('status');e.textContent=t;e.className='status '+c}
$('register').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),phone=$('phone').value.trim();if(!email||!phone)return status('Phone number and email are required.','error');if(!/^\S+@\S+\.\S+$/.test(email))return status('Enter a valid email address.','error');status('Creating test account...');let r=await sb.auth.getSession();me=r.data.session?.user||null;if(!me){const password='Test_'+crypto.randomUUID()+'!a9';r=await sb.auth.signUp({email,password});if(r.error)return status(r.error.message,'error');me=r.data.user}if(!me)return status('Supabase did not return a user. Check Auth settings.','error');let p=await sb.from('profiles').upsert({id:me.id,email:email,phone_number:phone},{onConflict:'id'});if(p.error)return status(p.error.message,'error');$('searchPanel').classList.remove('hidden');status('Registered. Phone number saved. Search the other device by phone number.','ok')};
$('searchBtn').onclick=async()=>{if(!me)return status('Register first.','error');const phone=$('findPhone').value.trim();if(!phone)return status('Enter a phone number.','error');let r=await sb.from('profiles').select('id,display_name,email,phone_number').eq('phone_number',phone).neq('id',me.id).maybeSingle();if(r.error)return status(r.error.message,'error');$('users').innerHTML='';if(!r.data){$('users').innerHTML='<div class="status">No VideoCall account found for this phone number.</div>';return}const row=document.createElement('div');row.className='user';row.innerHTML='<span>👤 '+(r.data.display_name||r.data.phone_number)+'</span><button class="btn">Start chat</button>';row.querySelector('button').onclick=()=>openChat(r.data);$('users').appendChild(row)};
async function openChat(u){let found=null,r=await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);let ids=(r.data||[]).map(x=>x.conversation_id);if(ids.length){let x=await sb.from('conversation_members').select('conversation_id').in('conversation_id',ids).eq('user_id',u.id);found=x.data?.[0]?.conversation_id||null}if(!found){let c=await sb.from('conversations').insert({conversation_type:'direct',created_by:me.id}).select('id').single();if(c.error)return status(c.error.message,'error');found=c.data.id;let m=await sb.from('conversation_members').insert([{conversation_id:found,user_id:me.id},{conversation_id:found,user_id:u.id}]);if(m.error)return status(m.error.message,'error')}conversationId=found;$('chatBar').classList.remove('hidden');$('chatName').textContent=u.display_name||u.phone_number;$('message').disabled=false;$('send').disabled=false;await loadMessages();if(channel)await sb.removeChannel(channel);channel=sb.channel('messages-'+conversationId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+conversationId},p=>render(p.new)).subscribe();status('Chat connected with '+u.phone_number,'ok')}
async function loadMessages(){let r=await sb.from('messages').select('*').eq('conversation_id',conversationId).order('created_at');if(r.error)return status(r.error.message,'error');$('messages').innerHTML='';(r.data||[]).forEach(render)}function render(m){if(document.querySelector('[data-id="'+m.id+'"]'))return;let d=document.createElement('div');d.dataset.id=m.id;d.className='msg '+(m.sender_id===me.id?'mine':'');d.innerHTML='<div>'+esc(m.body||'')+'</div><div class="meta">'+new Date(m.created_at).toLocaleTimeString()+'</div>';$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}$('send').onclick=send;$('message').onkeydown=e=>{if(e.key==='Enter')send()};async function send(){let body=$('message').value.trim();if(!body||!conversationId)return;let r=await sb.from('messages').insert({conversation_id:conversationId,sender_id:me.id,message_type:'text',body}).select().single();if(r.error)return status(r.error.message,'error');$('message').value='';render(r.data)}function esc(s){return s.replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function init(){let r=await sb.auth.getSession();if(r.data.session){me=r.data.session.user;$('searchPanel').classList.remove('hidden');status('Already signed in. Enter/search a phone number.','ok')}}init();</script></body></html>
