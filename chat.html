<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VideoCall — Chat</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#18212f}.app{max-width:900px;margin:30px auto;background:#fff;border:1px solid #e5eaf0;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #00000012}.top{padding:20px;border-bottom:1px solid #e8edf3}.top h1{margin:0 0 5px}.muted{color:#687386;font-size:14px}.auth,.search,.composer{padding:16px;display:flex;gap:10px;border-bottom:1px solid #e8edf3}.auth{flex-wrap:wrap}.auth input,.search input,.composer input{flex:1;min-width:180px;padding:12px;border:1px solid #d8dee8;border-radius:10px}.button{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:white;cursor:pointer;font-weight:600}.button.secondary{background:#e8eefc;color:#2452ad}.users{padding:12px 16px;border-bottom:1px solid #e8edf3}.user{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.messages{height:430px;overflow:auto;padding:20px;background:#f8fafc}.msg{max-width:72%;padding:10px 13px;border-radius:14px;margin:7px 0;background:#fff;border:1px solid #e3e8ef}.mine{margin-left:auto;background:#dbeafe;border-color:#bfdbfe}.meta{font-size:11px;color:#718096;margin-top:4px}.status{padding:8px 16px;font-size:13px}.error{color:#b42318}.success{color:#067647}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><h1>💬 VideoCall Chat</h1><div class="muted">Live Supabase messaging test</div></div>
  <div class="auth">
    <input id="email" type="email" placeholder="Your email">
    <input id="code" inputmode="numeric" placeholder="Email code">
    <button class="button" id="sendCode">Send code</button>
    <button class="button secondary" id="verify">Verify</button>
  </div>
  <div class="status" id="status">Sign in to test messaging.</div>
  <div class="search"><input id="find" placeholder="Find user by phone or email"><button class="button" id="searchBtn">Find</button></div>
  <div class="users" id="users"></div>
  <div class="messages" id="messages"><div class="muted">Select a user to start a chat.</div></div>
  <div class="composer"><input id="message" placeholder="Type a message..." disabled><button class="button" id="send" disabled>Send</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ifzwpwxuczxicqgwakrc.supabase.co';
const SUPABASE_KEY='REPLACE_WITH_YOUR_SUPABASE_PUBLISHABLE_KEY';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let me=null, other=null, conversationId=null, channel=null;
const $=id=>document.getElementById(id), status=(t,c='')=>{$('status').textContent=t;$('status').className='status '+c};
async function session(){const {data}=await sb.auth.getSession(); if(data.session){me=data.session.user; status('Signed in as '+me.email,'success'); await loadProfile();}}
async function loadProfile(){if(!me)return; await sb.from('profiles').upsert({id:me.id,email:me.email},{onConflict:'id'});}
$('sendCode').onclick=async()=>{const email=$('email').value.trim();if(!email)return status('Enter your email.','error');const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)return status(error.message,'error');status('Verification code sent to '+email,'success');};
$('verify').onclick=async()=>{const email=$('email').value.trim(),token=$('code').value.trim();if(!email||!token)return status('Enter email and code.','error');const {data,error}=await sb.auth.verifyOtp({email,token,type:'email'});if(error)return status(error.message,'error');me=data.user;await loadProfile();status('Signed in as '+me.email,'success');};
$('searchBtn').onclick=async()=>{if(!me)return status('Sign in first.','error');const q=$('find').value.trim();if(!q)return;let query=sb.from('profiles').select('id,display_name,email,phone_number').neq('id',me.id).limit(10);if(q.includes('@'))query=query.ilike('email','%'+q+'%');else query=query.or('phone_number.ilike.%'+q+'%,display_name.ilike.%'+q+'%');const {data,error}=await query;if(error)return status(error.message,'error');$('users').innerHTML='';(data||[]).forEach(u=>{const row=document.createElement('div');row.className='user';row.innerHTML='<span>👤 '+(u.display_name||u.email||u.phone_number)+'</span><button class="button secondary">Chat</button>';row.querySelector('button').onclick=()=>openChat(u);$('users').appendChild(row);});if(!data?.length)status('No matching user found.');};
async function openChat(u){other=u;const {data:existing}=await sb.from('conversations').select('id').eq('conversation_type','direct').order('created_at',{ascending:false});conversationId=(existing||[]).find(async c=>false);const {data:mine}=await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);const ids=(mine||[]).map(x=>x.conversation_id);const {data:their}=await sb.from('conversation_members').select('conversation_id').in('conversation_id',ids).eq('user_id',u.id);conversationId=their?.[0]?.conversation_id;if(!conversationId){const {data:c,error}=await sb.from('conversations').insert({conversation_type:'direct',created_by:me.id}).select('id').single();if(error)return status(error.message,'error');conversationId=c.id;const {error:e}=await sb.from('conversation_members').insert([{conversation_id:c.id,user_id:me.id},{conversation_id:c.id,user_id:u.id}]);if(e)return status(e.message,'error');} $('message').disabled=false;$('send').disabled=false;await loadMessages();if(channel)sb.removeChannel(channel);channel=sb.channel('chat-'+conversationId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+conversationId},payload=>renderMessage(payload.new)).subscribe();status('Chatting with '+(u.display_name||u.email),'success');}
async function loadMessages(){const {data,error}=await sb.from('messages').select('*').eq('conversation_id',conversationId).order('created_at',{ascending:true});if(error)return status(error.message,'error');$('messages').innerHTML='';(data||[]).forEach(renderMessage);$('messages').scrollTop=$('messages').scrollHeight;}
function renderMessage(m){if(document.querySelector('[data-msg="'+m.id+'"]'))return;const d=document.createElement('div');d.dataset.msg=m.id;d.className='msg '+(m.sender_id===me.id?'mine':'');d.innerHTML='<div>'+escapeHtml(m.body||'')+'</div><div class="meta">'+new Date(m.created_at).toLocaleTimeString()+'</div>';$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;}
$('send').onclick=sendMessage;$('message').onkeydown=e=>{if(e.key==='Enter')sendMessage();};
async function sendMessage(){const body=$('message').value.trim();if(!body||!conversationId)return;const {data,error}=await sb.from('messages').insert({conversation_id:conversationId,sender_id:me.id,message_type:'text',body}).select().single();if(error)return status(error.message,'error');$('message').value='';renderMessage(data);}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
session();
</script>
</body></html>
