<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contacts - VideoApp</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}html,body{margin:0;height:100%;background:#f5f7fa;color:#18212b}body{overflow:auto}.contacts-app{max-width:900px;margin:auto;min-height:100%;background:#fff}.topbar{height:70px;background:#fff;border-bottom:1px solid #e1e6eb;display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:10}.back{border:0;background:transparent;font-size:19px;color:#333;cursor:pointer;width:40px;height:40px}.brand{font-size:21px;font-weight:650;color:#1677d2}.brand i{margin-right:8px}.search{margin:16px;height:46px;background:#f1f3f5;display:flex;align-items:center;padding:0 14px;gap:10px;color:#667}.search input{border:0;background:transparent;outline:0;flex:1;font-size:14px}.content{padding:0 16px 90px}.section-title{font-size:13px;color:#687581;margin:18px 4px 8px;text-transform:uppercase}.contact{display:flex;align-items:center;width:100%;padding:13px 8px;border-bottom:1px solid #edf0f2;cursor:pointer}.contact:hover{background:#f5f9fd}.avatar{width:48px;height:48px;border-radius:50%;background:#1677d2;color:#fff;display:grid;place-items:center;font-weight:600;margin-right:13px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.info{min-width:0;flex:1}.name{font-size:15px;font-weight:600}.phone{font-size:13px;color:#75818c;margin-top:4px}.empty{text-align:center;color:#697681;padding:55px 20px}.empty i{font-size:38px;color:#1677d2;margin-bottom:12px}.loader{display:none;text-align:center;padding:35px;color:#1677d2}.loader.show{display:block}.fab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border:0;background:#1677d2;color:#fff;display:grid;place-items:center;font-size:21px;box-shadow:0 8px 24px rgba(22,119,210,.3);cursor:pointer}.popup{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);padding:12px 18px;background:#222;color:#fff;opacity:0;visibility:hidden;transition:.2s;z-index:20}.popup.show{opacity:1;visibility:visible;transform:translate(-50%,0)}.popup.error{background:#c62828}@media(max-width:600px){.topbar{height:62px;padding:0 10px}.search{margin:10px 12px}.content{padding:0 10px 90px}.fab{right:18px;bottom:78px}}
</style>
</head>
<body>
<div class="contacts-app">
<header class="topbar"><button class="back" id="back" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><div class="brand"><i class="fa-solid fa-video"></i>VideoApp</div></header>
<div class="search"><i class="fa-solid fa-search"></i><input id="searchInput" type="search" placeholder="Search by phone number or email" autocomplete="off"></div>
<main class="content"><div class="section-title">Find people</div><div id="loader" class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i><div>Searching...</div></div><div id="contactList"></div><div id="empty" class="empty"><i class="fa-solid fa-users"></i><h3>Find a contact</h3><p>Search for a VideoApp user by phone number or email.</p></div></main>
</div>
<button class="fab" id="invite" aria-label="Invite contact"><i class="fa-solid fa-plus"></i></button><div id="popup" class="popup" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script>
<script>
const list=document.getElementById('contactList'),empty=document.getElementById('empty'),loader=document.getElementById('loader'),input=document.getElementById('searchInput'),popup=document.getElementById('popup');
function showError(t){popup.textContent=t;popup.className='popup show error';setTimeout(()=>popup.className='popup',3000)}
function initials(n){return (n||'U').trim().split(/\\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'U'}
function render(rows){list.innerHTML='';empty.style.display=rows.length?'none':'block';rows.forEach(p=>{const el=document.createElement('button');el.type='button';el.className='contact';el.innerHTML='<div class="avatar">'+initials(p.full_name||p.name||p.email)+'</div><div class="info"><div class="name">'+(p.full_name||p.name||'VideoApp User')+'</div><div class="phone">'+(p.phone||p.email||'')+'</div></div>';el.addEventListener('click',()=>{localStorage.setItem('videoapp_contact_id',p.id);location.href='dashboard.html'});list.appendChild(el)})}
let timer;async function search(){const q=input.value.trim();clearTimeout(timer);timer=setTimeout(async()=>{if(!q){render([]);return}loader.classList.add('show');list.innerHTML='';empty.style.display='none';try{const client=window.supabaseClient;if(!client)throw new Error('Supabase client is not available');const {data:userData,error:userErr}=await client.auth.getUser();if(userErr||!userData.user)throw new Error('Please log in again.');let query=client.from('profiles').select('id,full_name,name,phone,email').limit(20);if(q.includes('@'))query=query.ilike('email','%'+q+'%');else query=query.or('phone.ilike.%'+q+'%,full_name.ilike.%'+q+'%,name.ilike.%'+q+'%');const {data,error}=await query;if(error)throw error;render((data||[]).filter(p=>p.id!==userData.user.id))}catch(e){render([]);showError(e.message||'Could not search contacts.')}finally{loader.classList.remove('show')}},250)}
input.addEventListener('input',search);document.getElementById('back').onclick=()=>location.href='dashboard.html';document.getElementById('invite').onclick=()=>navigator.share?navigator.share({title:'Join VideoApp',text:'Join me on VideoApp'}).catch(()=>{}):showError('Share is not available on this device.');
</script>
</body></html>
