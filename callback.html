<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifying • VideoCall</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef4ff,#f8fbff);font-family:Inter,Arial,sans-serif;color:#172033}.card{width:min(460px,calc(100% - 32px));background:#fff;border-radius:28px;padding:42px;text-align:center;box-shadow:0 25px 70px rgba(31,41,55,.12)}.logo{width:72px;height:72px;border-radius:20px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 20px}.spinner{width:44px;height:44px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:28px;margin:10px 0}.muted{color:#667085;line-height:1.6}.success{color:#067647}.error{color:#b42318}.action{display:none;margin-top:22px;padding:13px 20px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.action.show{display:inline-block}.hidden{display:none}</style></head><body><main class="card"><div class="logo"><i class="fa-solid fa-video"></i></div><div id="working"><div class="spinner"></div><h1>Verifying your account</h1><p class="muted">Please wait while we securely complete your verification.</p></div><div id="result" class="hidden"><h1 id="title"></h1><p id="message" class="muted"></p><button id="action" class="action"></button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/supabase.js"></script><script>const working=document.getElementById('working'),result=document.getElementById('result'),title=document.getElementById('title'),message=document.getElementById('message'),action=document.getElementById('action');function finish(ok,t,m,label,url){working.classList.add('hidden');result.classList.remove('hidden');title.textContent=t;title.className=ok?'success':'error';message.textContent=m;action.textContent=label;action.classList.add('show');action.onclick=()=>location.href=url}async function run(){try{const hash=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,'')).get('access_token');const query=new URLSearchParams(location.search);const code=query.get('code');if(code){const {error}=await window.supabaseClient.auth.exchangeCodeForSession(code);if(error)throw error}else if(hash){const access_token=new URLSearchParams(location.hash.substring(1)).get('access_token');const refresh_token=new URLSearchParams(location.hash.substring(1)).get('refresh_token');if(access_token&&refresh_token){const {error}=await window.supabaseClient.auth.setSession({access_token,refresh_token});if(error)throw error}}else{const {data}=await window.supabaseClient.auth.getSession();if(!data.session)throw new Error('This verification link is missing or has expired.')}const {data:userData}=await window.supabaseClient.auth.getUser();if(!userData.user)throw new Error('We could not verify this account.');finish(true,'Verification successful','Your account has been verified. You can continue to your VideoCall dashboard.','Continue to dashboard','dashboard.html')}catch(e){finish(false,'Verification failed',e.message||'This verification link is invalid or has expired.','Return to login','login.html')}}run();</script></body></html>
