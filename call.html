<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoCall — Call</title><link rel="stylesheet" href="css/style.css"></head>
<body class="call-body"><main class="call-page"><header class="call-header"><div class="brand"><span class="brand-icon">◉</span> VideoCall</div><div><span id="connectionStatus" class="status"><i></i> Connecting</span><span class="room-pill">Code <strong id="roomCode">------</strong></span></div></header>
<section id="videoStage" class="video-stage"><video id="remoteVideo" autoplay playsinline></video><div id="voiceStage" class="remote-placeholder hidden"><div class="big-icon">📞</div><h2>Voice Call</h2><p>Audio only — your camera is not used.</p></div><div id="remotePlaceholder" class="remote-placeholder"><div class="big-icon">👤</div><h2 id="callTitle">Waiting for the other person…</h2><p>Share your 6-digit code with them.</p></div><div id="localVideoWrap" class="local-video-wrap"><video id="localVideo" autoplay muted playsinline></video></div><div id="callMessage" class="call-message">Preparing your call…</div></section>
<section class="call-controls"><button id="muteButton" type="button">🎤 Mute</button><button id="cameraButton" type="button">📷 Camera off</button><button id="endCallButton" class="danger" type="button">☎ End call</button></section></main>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="js/app.js"></script><script src="js/call.js"></script></body></html>
